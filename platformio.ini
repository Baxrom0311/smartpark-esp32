; SmartPark ESP32 firmware — PlatformIO project
; Target: ESP32 DevKit v1, Arduino framework
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; Serial monitor (matches Serial.begin() in firmware)
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11

; Pinned library dependencies
lib_deps =
    bblanchon/ArduinoJson@7.0.4

; Filesystem layout uses default (src/, include/, lib/, test/)
